# Ever fork only — keeps the UI data (gh/data/*.json) fresh.
#
# The repo pages (/owner/repo), the home sidebar and the OG cards read gh/data/*.json at
# BUILD time. That snapshot was generated once by hand on 2026-08-04 and never again, so in
# October stats-github.ever.co/ever-co/ever-gauzy still said 4.1k stars when it had 8.4k.
#
# This regenerates it daily from the GitHub API, commits it, then dispatches k8s-build. The
# files carry updated_at, so in practice that is one commit and one rollout a day; a run that
# changes nothing (re-run the same day) commits nothing. The dispatch is required: a push
# made with GITHUB_TOKEN does not trigger other workflows, but a workflow_dispatch does.
#
# CI's own GITHUB_TOKEN is enough: every endpoint the seed script uses is public. It also
# cannot see private repos (cloc-co/zero), which must stay out of this public data.
name: ever-refresh-data
on:
  schedule:
    # Daily, off the hour so it does not queue behind the fleet's top-of-hour jobs.
    - cron: "23 4 * * *"
  workflow_dispatch:
concurrency:
  group: ever-refresh-data
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # No dependencies: the script uses only Node built-ins and fetch. It exits non-zero
      # when a public repo fails to resolve (a skip would drop its page from the build), and
      # a metric that fails keeps the previous run's value, so an outage never commits zeros.
      - name: Regenerate gh/data
        run: node ever/seed-gh-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: commit
        name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- gh/data; then
            echo "gh/data unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --stat -- gh/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh/data
          git commit -m "ever(data): refresh gh/data from the GitHub API"
          # main may have moved while the seed ran; gh/data is only ever written here.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The ARC runner image has no `gh` CLI (`gh: command not found`, exit 127, on the first
      # real run 2026-10-16), so dispatch through the REST API with the Node set up above.
      - name: Rebuild the images
        if: steps.commit.outputs.changed == 'true'
        run: |
          node --input-type=module -e '
            const res = await fetch(`https://api.github.com/repos/${process.env.REPO}/actions/workflows/k8s-build.yml/dispatches`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" },
              body: JSON.stringify({ ref: "main" }),
            });
            if (res.status !== 204) {
              console.error(`dispatch failed: ${res.status} ${await res.text()}`);
              process.exit(1);
            }
            console.log("dispatched k8s-build on main");
          '
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
