# Ever fork only — builds the two images that back the self-hosted instance on
# stats-github.ever.co / .ever.works / .cloc.com. Follows the fleet CI/CD standard:
# GitHub Actions -> self-hosted ARC runner -> buildx -> GHCR -> ArgoCD Image Updater.
name: k8s-build
on:
  workflow_dispatch:
  push:
    branches: [develop, stage, main, master]
    # README/docs-only edits must not spend a runner or roll the cluster.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
concurrency:
  group: k8s-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hono SVG renderer. Serves /svg and /healthz, holds the PATs and the
          # per-Host allowlist (ever/allowlist.json, baked in at ever/allowlist.json).
          - image: star-history-backend
            dockerfile: backend/Dockerfile
          # Next static export served by nginx. Context is the REPO ROOT for both,
          # because the frontend resolves @shared -> ../shared and @gh-data -> ../gh/data.
          - image: star-history-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: t
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
            main|master) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT" ;;
          esac
      # NEXT_PUBLIC_API_URL=same-origin is deliberate and load-bearing: ONE frontend
      # build serves all three hostnames, and each must call its OWN backend vhost,
      # because the backend allowlists per Host header. Baking an absolute API URL
      # would send ever.works' charts to ever.co's vhost and earn a 403.
      # NEXT_PUBLIC_SITE_URL only feeds canonical/OG tags and the sitemap.
      #
      # ghcr.io can answer 403 on the blob HEAD for two different reasons: the package
      # is not linked to this repo (permission — a retry cannot fix it, connect the
      # package in the UI), or a transient race when both matrix images push at once
      # (a retry does fix it). So attempt once softly, back off, then retry hard.
      - id: buildpush
        uses: docker/build-push-action@v7.3.0
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=same-origin
            NEXT_PUBLIC_SITE_URL=https://stats-github.ever.co
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
      - if: steps.buildpush.outcome == 'failure'
        run: sleep 45
      # Not continue-on-error: a persistent failure must fail the job.
      - if: steps.buildpush.outcome == 'failure'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=same-origin
            NEXT_PUBLIC_SITE_URL=https://stats-github.ever.co
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
