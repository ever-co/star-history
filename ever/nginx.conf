# nginx vhost for the star-history static export (Ever self-hosted frontend).
#
# Next is built with output: "export", so this serves plain files. Only the UI is
# served here — /svg and /healthz are path-routed to the backend Service by the
# Ingress and never reach this container.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx must not resolve the container's own hostname for anything.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: short cache, because a rebuild changes index.html in place.
    location / {
        add_header Cache-Control "public, max-age=300";
        # next export writes /foo.html for /foo, and /foo/index.html when trailingSlash.
        # End with =404, NOT /404.html: naming the file directly makes nginx serve it
        # with status 200, so every unknown URL becomes a soft-404. =404 raises a real
        # 404 that error_page below then renders with the styled page.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Container-local liveness. The app's own /healthz lives on the backend.
    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
